name: Build on Windows
on: 

  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev", "releases/**"  ]
  workflow_dispatch:
    inputs:
      compiler:
        required: false
        type: string
        default: msvc
          
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
        default: msvc

jobs:
    build-windows:
        runs-on: windows-latest
        
        steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

        - name: Install Qt
          uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 -- note: "v4" is a BRANCH here, not a tag
          with:
            version: '6.8.3'
            host: 'windows'
            target: 'desktop'
            modules: 'qt5compat'
          
        - name: install numpy
          run: pip install numpy
          
        - name: install hdf5
          run: pip install h5py

        - name: Build on Windows
          run: |
              mkdir build 
              cd build 
              cmake .. -DCMAKE_BUILD_TYPE=Debug -DNO_WARNINGS=ON -DWITH_FFMPEG=ON -DWITH_PYTHON=ON -DLOCAL_INSTALL=ON 
              cmake --build ./ 
              cmake --build . --target install

        - name: Run tests
          run: ctest --test-dir build --output-on-failure
          shell: bash

        
