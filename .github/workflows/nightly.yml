name: nightly

# What does not fit in a pull request: the full platform matrix, every plugin,
# and the slow analysers. Nothing here blocks anything.

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      heavy:
        description: Include the heavy analyses
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit in the last 25 h, run cancelled." >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    uses: ./.github/workflows/wf-lint.yml

  build:
    needs: [guard, lint]
    if: needs.guard.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x64-qt6,      runner: ubuntu-24.04, qt: 6.8.3,  coverage: true}
          - {label: linux-x64-qt5.15,   runner: ubuntu-22.04, qt: 5.15.2, coverage: true}
          - {label: windows-x64-qt6,    runner: windows-2022, qt: 6.8.3,  coverage: false}
          - {label: windows-x64-qt5.15, runner: windows-2022, qt: 5.15.2, coverage: false}
          - {label: macos-qt6,          runner: macos-latest, qt: 6.8.3,  coverage: false}
    uses: ./.github/workflows/wf-build-test.yml
    with:
      runner: ${{ matrix.runner }}
      qt-version: ${{ matrix.qt }}
      label: ${{ matrix.label }}
      tests: true
      coverage: ${{ matrix.coverage }}
      upload-coverage: ${{ matrix.coverage }}
      plugins: true
      werror: true
      retention-days: 14
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  heavy:
    needs: [guard, build]
    if: needs.guard.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.heavy)
    uses: ./.github/workflows/wf-heavy.yml
    with:
      blocking: false
    permissions:
      contents: read
      security-events: write
