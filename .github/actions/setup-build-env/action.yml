name: setup build env
description: System dependencies, Qt, Ninja and the compiler cache. Single place where the toolchain is described.

inputs:
  qt-version:
    description: Qt version to install (5.15.2 or 6.8.3)
    required: true
  cache-key:
    description: Suffix of the ccache/sccache key. One key per build configuration.
    required: true
  plugins:
    description: Also install what WITH_FFMPEG, WITH_PYTHON and WITH_HDF5 need
    required: false
    default: 'false'
  coverage:
    description: Also install lcov
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Split in two commands on purpose. libasound2 was renamed libasound2t64 in
    # Ubuntu 24.04, and `apt-get install a b c || apt-get install c` would, on
    # the fallback, install c ALONE and silently drop a and b.
    - name: System dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build mesa-utils \
          libgl1-mesa-dev libglu1-mesa-dev libegl1 \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
          libfontconfig1 libfreetype6 libdbus-1-3 libnss3
        sudo apt-get install -y --no-install-recommends libasound2t64 \
          || sudo apt-get install -y --no-install-recommends libasound2

    - name: System dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja

    - name: System dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install ninja --no-progress -y

    # Ninja needs cl.exe, link.exe and the Windows SDK on PATH; the Visual
    # Studio generator would find them on its own, Ninja does not.
    - name: MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
      with:
        version: ${{ inputs.qt-version }}
        modules: ${{ startsWith(inputs.qt-version, '6.') && 'qt5compat qtimageformats' || '' }}
        cache: true
        setup-python: false

    - name: Plugin dependencies (Linux)
      if: inputs.plugins == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          libhdf5-dev nasm yasm pkg-config
        python3 -m pip install --user --upgrade numpy

    - name: Plugin dependencies (Windows)
      if: inputs.plugins == 'true' && runner.os == 'Windows'
      shell: bash
      run: python -m pip install --upgrade numpy h5py

    - name: Coverage tools
      if: inputs.coverage == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y lcov

    # One cache per configuration: a sanitizer build and a coverage build share
    # no object, and mixing them in one key evicts both.
    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ inputs.cache-key }}
        variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
        max-size: 1G
